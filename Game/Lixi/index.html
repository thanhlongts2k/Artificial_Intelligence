<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🧧 Lì Xì May Mắn - Vòng Quay Tết 🧧</title>
    <!-- Google Fonts Montserrat for premium look and excellent Vietnamese support -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="./asset/favicon.ico">
        <link rel="stylesheet" href="./asset/css/lixi.css">
</head>

<body>
    <main class="app">
        <!-- 🧧 SECTION 1: SETTING SCREEN -->
        <div id="settingSection" class="panel">
            <h1><span class="decor-emoji">🧧</span> Setting Lì Xì <span class="decor-emoji">🧧</span></h1>

            <div class="money-display">
                <div id="totalMoney">0đ</div>
                <button id="clearBtn" class="clear-btn" title="Xóa tổng tiền">✕</button>
            </div>

            <!-- List of Money Cards (Grid layout, compact) -->
            <div id="moneyGrid" class="money-grid"></div>

            <button id="doneBtn" class="done-btn" disabled>Hoàn tất</button>
            <p class="hint">Click nút [+] hoặc [-] để cấu hình số tờ lì xì. Vòng quay sẽ chỉ quay trúng các mệnh giá bạn
                đã chọn.</p>
        </div>

        <!-- 🎉 SECTION 2: WHEEL SCREEN -->
        <div id="wheelSection" class="panel">
            <h2><span class="decor-emoji">🎉</span> Vòng Quay May Mắn <span class="decor-emoji">🎉</span></h2>

            <!-- Budget Remaining Header -->
            <div class="remaining-budget">🧧 Số tiền còn lại: <span id="remainingMoneyText">0đ</span></div>

            <div class="wheel-container">
                <!-- Pointer pointer at 12 o'clock -->
                <div class="wheel-pointer"></div>
                <canvas id="wheelCanvas" width="500" height="500"></canvas>
            </div>

            <button id="spinBtn" class="spin-btn">Quay</button>
            <br />
            <!-- Back to configuration button -->
            <button id="backToSettingsBtn" class="back-to-settings-btn">Nạp thêm tiền 🧧</button>
        </div>
    </main>

    <!-- 🎁 Celebration overlay modal -->
    <div id="celebrationModal" class="celebration-modal">
        <div class="modal-card">
            <div class="lixi-envelope">
                <span class="envelope-icon">🧧</span>
                <h3>Nhận Lì Xì Thành Công</h3>
                <p>Số tiền lì xì của bạn là</p>
                <div class="prize-glow" id="modalPrizeAmount">100k</div>
            </div>
            <button id="claimBtn" class="claim-btn">Nhận Lì Xì</button>
        </div>
    </div>

    <!-- 💸 Out of Money warning overlay modal -->
    <div id="outOfMoneyModal" class="celebration-modal">
        <div class="modal-card" style="border-color: #ff4d4d; background: linear-gradient(135deg, #4a0007, #7a0010);">
            <div class="lixi-envelope">
                <span class="envelope-icon" style="animation: none;">💸</span>
                <h3 style="color: #ff4d4d;">Hết Tiền Lì Xì Rồi!</h3>
                <p style="margin: 10px 0; color: #ff9999;">Bạn đã hết tiền!<br>Vui lòng nạp thêm tiền 😂</p>
            </div>
            <button id="backToWheelBtn" class="claim-btn"
                style="background: linear-gradient(180deg, #ff6b6b, #c8102e); color: white; border-color: #ff9999;">
                Trở Lại
            </button>
        </div>
    </div>

        <script src="./asset/js/lixi.js"></script>
</body>

</html>
